name: Portfolio preview QA
on:
  pull_request:
  push:
    branches:
      - design/portfolio-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser automation
        run: python -m pip install --disable-pip-version-check playwright
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Test real responsive render
        run: python tests/ui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-responsive-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: ignore
